services:
  - type: web
    name: sscrm-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: "?sslmode=require&stringtype=unspecified"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MIN_IDLE
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "7200000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_ENABLED
        value: "false"
