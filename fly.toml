# fly.toml app configuration file generated for sscrm-backend on 2024-02-18T10:55:00+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "sscrm-backend"
primary_region = "sin" # Singapore (closest to India), change if needed

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "prod"
  # DB_SSL_MODE is required for Neon
  DB_SSL_MODE = "?sslmode=require"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"  # Spring Boot needs at least 512MB usually
  cpus = 1
  cpu_kind = "shared"

[[checks]]
  port = 8080
  type = "http"
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/login"
