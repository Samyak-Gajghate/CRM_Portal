# fly.toml app configuration file generated for sscrm-backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "sscrm-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SPRING_PROFILES_ACTIVE = "prod"
  DB_SSL_MODE = "?sslmode=require"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/login"
