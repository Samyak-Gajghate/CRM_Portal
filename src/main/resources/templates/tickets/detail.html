<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<body>
    <div layout:fragment="content">
        <div class="mb-4">
            <a th:href="@{/tickets}" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Tickets
            </a>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="card-header">
                        <h4 class="mb-0">Ticket #<span th:text="${ticket.id}">1</span></h4>
                    </div>
                    <div class="card-body">
                        <h5 th:text="${ticket.title}">Ticket Title</h5>
                        <p class="text-muted" th:text="${ticket.description}">Description</p>

                        <hr>

                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Customer:</strong> <span th:text="${ticket.customer.name}">Customer</span>
                                </p>
                                <p><strong>Status:</strong>
                                    <span class="badge"
                                        th:classappend="${'badge-status-' + #strings.toLowerCase(ticket.status)}"
                                        th:text="${ticket.status}">OPEN</span>
                                </p>
                                <p><strong>Priority:</strong>
                                    <span class="badge"
                                        th:classappend="${'badge-priority-' + #strings.toLowerCase(ticket.priority)}"
                                        th:text="${ticket.priority}">MEDIUM</span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Assigned To:</strong>
                                    <span
                                        th:text="${ticket.assignedAgent != null ? ticket.assignedAgent.username : 'Unassigned'}">Agent</span>
                                </p>
                                <p><strong>Created:</strong>
                                    <span
                                        th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                                </p>
                                <p><strong>Due Time:</strong>
                                    <span
                                        th:text="${#temporals.format(ticket.dueTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ticket History -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">History</h5>
                    </div>
                    <div class="card-body">
                        <div class="timeline">
                            <div th:each="h : ${history}" class="mb-3">
                                <div class="d-flex">
                                    <div class="flex-shrink-0">
                                        <i class="bi bi-clock-history text-muted"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <p class="mb-1">
                                            <strong th:text="${h.actionType}">ACTION</strong>
                                            <span th:if="${h.oldValue != null}">
                                                from <span class="badge bg-secondary" th:text="${h.oldValue}">old</span>
                                            </span>
                                            <span th:if="${h.newValue != null}">
                                                to <span class="badge bg-primary" th:text="${h.newValue}">new</span>
                                            </span>
                                        </p>
                                        <small class="text-muted">
                                            <span
                                                th:text="${h.changedBy != null ? h.changedBy.username : 'System'}">User</span>
                                            • <span
                                                th:text="${#temporals.format(h.timestamp, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Actions</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Update ticket status:</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-warning" th:if="${ticket.status.name() == 'OPEN'}">
                                <i class="bi bi-play-circle"></i> Start Progress
                            </button>
                            <button class="btn btn-success" th:if="${ticket.status.name() == 'IN_PROGRESS'}">
                                <i class="bi bi-check-circle"></i> Resolve
                            </button>
                            <button class="btn btn-danger" th:if="${ticket.status.name() == 'IN_PROGRESS'}">
                                <i class="bi bi-exclamation-triangle"></i> Escalate
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
