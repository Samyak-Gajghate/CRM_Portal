<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-ticket-perforated"></i> Tickets</h2>
            <a th:href="@{/tickets/create}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Create Ticket
            </a>
        </div>

        <!-- Filter -->
        <div class="card mb-3">
            <div class="card-body">
                <form th:action="@{/tickets}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Filter by Status</label>
                        <select name="status" class="form-select">
                            <option value="">All Statuses</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-secondary">
                            <i class="bi bi-funnel"></i> Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tickets Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Customer</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Assigned To</th>
                                <th>Due Time</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${tickets}">
                                <td th:text="${ticket.id}">#1</td>
                                <td th:text="${ticket.title}">Title</td>
                                <td th:text="${ticket.customer.name}">Customer</td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${'badge-status-' + #strings.toLowerCase(ticket.status)}"
                                        th:text="${ticket.status}">OPEN</span>
                                </td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${'badge-priority-' + #strings.toLowerCase(ticket.priority)}"
                                        th:text="${ticket.priority}">MEDIUM</span>
                                </td>
                                <td
                                    th:text="${ticket.assignedAgent != null ? ticket.assignedAgent.username : 'Unassigned'}">
                                    Agent</td>
                                <td th:text="${#temporals.format(ticket.dueTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                                <td>
                                    <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-sm btn-info">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
