<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - CRM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 text-center">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
                        <h1 class="mt-3" th:text="${status} ?: '500'">500</h1>
                        <h3 th:text="${error} ?: 'Internal Server Error'">Error</h3>
                        <p class="text-muted" th:text="${message} ?: 'An unexpected error occurred'">
                            Something went wrong
                        </p>
                        <a href="/dashboard" class="btn btn-primary mt-3">
                            <i class="bi bi-house"></i> Go to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
