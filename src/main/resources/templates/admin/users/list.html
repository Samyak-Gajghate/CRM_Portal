<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people"></i> User Management</h2>
            <a th:href="@{/admin/users/create}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Create User
            </a>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Filter by Role -->
        <div class="card mb-3">
            <div class="card-body">
                <form th:action="@{/admin/users}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label for="role" class="form-label">Filter by Role</label>
                        <select class="form-select" id="role" name="role" onchange="this.form.submit()">
                            <option value="">All Roles</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td>
                                    <i class="bi bi-person-circle"></i>
                                    <span th:text="${user.username}"></span>
                                </td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${user.role == T(com.sscrm.entity.UserRole).ADMIN} ? 'bg-danger' : 
                                                          (${user.role == T(com.sscrm.entity.UserRole).AGENT} ? 'bg-primary' : 'bg-secondary')"
                                        th:text="${user.role}">
                                    </span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'"
                                        th:text="${user.active} ? 'Active' : 'Inactive'">
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                            class="btn btn-outline-primary" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}"
                                            method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-outline-warning"
                                                th:title="${user.active} ? 'Deactivate' : 'Activate'">
                                                <i
                                                    th:class="${user.active} ? 'bi bi-pause-circle' : 'bi bi-play-circle'"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                                            style="display: inline;"
                                            onsubmit="return confirm('Are you sure you want to delete this user?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${#lists.isEmpty(users)}" class="text-center text-muted py-4">
                    <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                    <p class="mt-2">No users found</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
