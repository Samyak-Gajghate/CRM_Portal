<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<body>
    <div layout:fragment="content">
        <h2 class="mb-4"><i class="bi bi-pencil"></i> Edit User</h2>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" method="post">
                    <!-- Username (Read-only) -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" th:value="${user.username}" readonly
                            disabled>
                        <div class="form-text">Username cannot be changed</div>
                    </div>

                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" th:value="${user.email}"
                            required>
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-3">
                        <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
                        <select class="form-select" id="role" name="role" required>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                th:selected="${r == user.role}">
                            </option>
                        </select>
                    </div>

                    <!-- Active Status -->
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="active" name="active"
                                th:checked="${user.active}" value="true">
                            <label class="form-check-label" for="active">
                                Active
                            </label>
                        </div>
                        <div class="form-text">Inactive users cannot log in</div>
                    </div>

                    <!-- User Info -->
                    <div class="alert alert-info">
                        <strong>User ID:</strong> <span th:text="${user.id}"></span><br>
                        <strong>Created:</strong> <span
                            th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></span><br>
                        <strong>Last Updated:</strong> <span
                            th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>

                    <!-- Form Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Update User
                        </button>
                        <a th:href="@{/admin/users}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
